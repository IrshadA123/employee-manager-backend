
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: employee_management_db
      POSTGRES_USER: employee_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - employee_management_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U employee_app -d employee_management_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  employee_management_pgdata:
